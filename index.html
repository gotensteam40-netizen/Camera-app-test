<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enquadra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000;--fg:#fff;--amber:#f5a623;--chip:#222;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;max-width:calc((100dvh - 210px)*.75);aspect-ratio:3/4;background:#111;border-radius:18px;overflow:hidden}
#view{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ln{stroke:var(--amber);stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke}
#ring,#dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#ring{left:50%;top:50%;width:56px;height:56px;border:2px solid #fff8;transition:.2s}
#ring.ok{border-color:#4ade80;box-shadow:0 0 18px #4ade80aa}
#dot{width:16px;height:16px;background:var(--amber);box-shadow:0 0 14px var(--amber)}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000a;padding:7px 14px;border-radius:16px;font-size:13px;text-align:center;line-height:1.3;max-width:62%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(#fff5,#fff5) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff5,#fff5) 66.66% 0/1px 100% no-repeat,linear-gradient(#fff5,#fff5) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff5,#fff5) 0 66.66%/100% 1px no-repeat}
#gridbtn{position:absolute;right:10px;top:8px;background:#000a}
#ctrl{padding:8px 0 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
#filters,#zooms{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:0 12px}
.chip{background:var(--chip);color:var(--fg);border:0;border-radius:99px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--amber);color:#000;font-weight:600}
#row{display:flex;align-items:center;gap:36px}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid #000;outline:3px solid #fff}
#shot:active{transform:scale(.93)}
.side{width:48px;height:48px;border-radius:50%;background:var(--chip);color:var(--fg);border:0;font-size:15px;font-weight:700}
.side.on{background:var(--amber);color:#000}
#start{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:var(--amber);color:#000;border:0;border-radius:99px;padding:16px 28px;font-size:17px;font-weight:700}
#modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#pic{max-width:100%;max-height:70%;border-radius:12px}
</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Enquadra"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAAGAElEQVR4nO3dv40bRxiG8ZFhgPEZMKDALagQx27BgANXoApUgQMXoViFqAUDVuScmYOBFguS73J2d/683/D5hcLpODP38NvV8cR79/b2loBHfhi9APgiDkjEAYk4IBEHJOKARByQiAMScUAiDkjEAYk4IBEHJOKARByQiAMScUAiDkjEAYk4IBEHJOKARByQiAMScUAiDkjEAYk4IBEHpB9HL2CYL5//Lv/gX3/7o91KbL17kbdg2JVCiVfIZeY4qgehzBrKhHF0a+LeZJVMFcfALNamSWSGOEyauBe9kthx2GaxFjeRqHGEyGItYiIhvwkWrowUc83BJkfEI74RaIREmhwTlJFC7SLG5Ah0oOX8R0iAyTFlGSnCvtzj8D/BM8x353tZ6XBwhYPdZyWdmcbR6OtR5WvgvLa6HOOoe/pNDz3QUg+wi6PicXc764hrLuEVR5VTHni+5ev/8O3j/R9+ff8pOfVhFMf5MkyOdXsjD7NY+/r+k8lGXOIYUsb1ei35sMvlsvczq+08LSMz6cMijpNl7DrHwiCUXaHc7KuwjMyhD/dvgj1VeILX704+3K7Ps17brjIOfHwL4yfH4bFRksX5Gp4qmSX//PXTsU/+y5//HfuLVQyeHO3KqDInSjR9oLHfXx8ZR6MyumVR+KCHx0ZK6cO3jwP7iHfP8bSMbitxe/TqhsVx7AmxUcaQgdFnGaOGx5g4WpRxYjn1zdFHmMtKoDIyz1XtMiCOA08CVYbJpUSpu7z+w6N3HHXLOL2cYDr34X5ZmaCMn3//9/Dfza/TjtI1jlrhByqjup7Dw3pyDH/lqZZjw2Ps2Eg949ib/AQXlLW9fWyU0W14WE+Oe0HLyMr7GD4zMtM4Ho6N0GVkJX2YlJG6vWRf5a37Jogju1wuD1+N25VFhxuyMG81OU0ZKaXr9frwBzW+fO6/li09Livnx8ZMZWQPd7RrGHS4LTW954CDAHHMNzYy/301j4N3kd7F6sriPjn8n15nmO/OKA7GRuZzDkZxwE3bOE5eFM2nbhUn99j0toPJAcklDp8LrQOT03CJ494rXFMy2536xoHhiANSwzjM32RzGu3O2WJy3N9/2V6GG7nfr8M9qUUc8EQckIgDEnFAIg5IxAGJOCARByTigEQckIgDEnFAsojj/nXFA7/FIrT7/Tq8pt0wDofXFV9Bu3O2mBzwRByQfON4ndsO2526xOFw/+XD5DRc4oChtnGcvJG2nbcVndxj038SMjkgGcVhcqEdzuccjOJ4aO4ri/numsdh9T5G/qzeJct9ciT7p9dh/vsKEAdG6RHH+SuL/5Nsr4c7srqmpECTY6Y+ouylUxzclj7lNjaS7eSY+OJy/oLSjWkcSvQ+Yq2/Xxx7J6F6MsU63zW18lq/4Kw668nhOWzrct5j1zhqJR9xeNRac8+fzLWeHGmWi0utC0pnveM4EH70PiqW0fkH+gdMjrp9OCeysTz/MpL/ZWWxcZqefWysyvxqshgTx7EnQaA+qpcx5H+IDZscLfpwSGR7GYHKSIEuK4vt8x3bx/ajR7maLEbGcfgJ8bSP/ok8fdDDZQz8L8eDJ0ejPlLHREoeKGIZqdvvst92Zt4WHl/1N1MvLK/D1tqJd89xo/D0L9+dfLhdnyfcTcYNi8mRapzjgedZ4Tg5kNSQ7VTnEkea5UD <div id="app">
 <div id="stage"><div id="frame">
  <canvas id="view" width="480" height="640"></canvas>
  <svg id="ov" viewBox="0 0 100 100" preserveAspectRatio="none"><line id="ln" x1="50" y1="50" x2="50" y2="50"/></svg>
  <div id="ring"></div><div id="dot"></div>
  <div id="hint">Toque em “Ativar câmera”</div>
  <div id="grid"></div><button class="chip" id="gridbtn">Grade</button>
  <div id="flash"></div>
 </div></div>
 <div id="ctrl">
  <div id="filters"></div>
  <div id="row"><button class="side" id="flip">⟲</button><button id="shot" aria-label="Fotografar"></button><button class="side" id="auto">IA</button></div>
  <div id="zooms"></div>
 </div>
</div>
<button id="start">Ativar câmera</button>
<div id="modal"><img id="pic" alt="Foto"><div>Segure na foto para salvar</div><button class="chip on" id="close">Fechar</button></div>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const W=480,H=640,view=$('view'),vctx=view.getContext('2d',{willReadFrequently:true});
const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const sm=document.createElement('canvas');sm.width=48;sm.height=64;const sctx=sm.getContext('2d',{willReadFrequently:true});
const FILTERS={
 'Natural':{},
 'Vintage':{con:1.1,sat:.75,bri:1.05,tint:[18,8,-14],fade:18,grain:10},
 'Negativo':{con:1.25,sat:1.2,bri:1,tint:[-6,6,10],fade:10,grain:14},
 'P&B':{con:1.3,sat:0,bri:1.02,fade:8,grain:16},
 'Cinema':{con:1.15,sat:1.1,bri:.98,split:1},
 'Kodak':{con:1.1,sat:1.25,bri:1.03,tint:[14,6,-10],fade:6,grain:8},
 'Fuji':{con:1.1,sat:1.1,bri:1,tint:[-8,6,4],fade:8,grain:8},
 'Polaroid':{con:.95,sat:.85,bri:1.08,tint:[10,4,10],fade:26,grain:6},
 'Sépia':{con:1.1,sat:0,bri:1.05,tint:[40,20,-20],fade:10,grain:12},
 'Noir':{con:1.6,sat:0,bri:.95,grain:20}
};
let cur='Natural',manualZ=1,auto=false,facing='environment',mirror=false,stream=null;
const V={z:1,cx:.5,cy:.5},T={x:.5,y:.5,z:1};
function fx(d,f){const con=f.con||1,sat=f.sat??1,bri=f.bri||1,t=f.tint||[0,0,0],fade=f.fade||0,gr=f.grain||0,sp=f.split||0;
 for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];const l=.299*r+.587*g+.114*b;
  r=l+(r-l)*sat;g=l+(g-l)*sat;b=l+(b-l)*sat;
  r=(r-128)*con+128;g=(g-128)*con+128;b=(b-128)*con+128;
  const k=(l/255-.5)*40*sp;
  r=r*bri+t[0]+fade+k;g=g*bri+t[1]+fade;b=b*bri+t[2]+fade-k;
  if(gr){const n=(Math.random()-.5)*gr;r+=n;g+=n;b+=n}
  d[i]=r;d[i+1]=g;d[i+2]=b}}
function draw(ctx,w,h,v,f){
 const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return false;
 let bw,bh;if(vw/vh>.75){bh=vh;bw=vh*.75}else{bw=vw;bh=vw/.75}
 const bx=(vw-bw)/2,by=(vh-bh)/2,sw=bw/v.z,sh=bh/v.z,cxs=mirror?1-v.cx:v.cx;
 const sx=bx+clamp(cxs*bw-sw/2,0,bw-sw),sy=by+clamp(v.cy*bh-sh/2,0,bh-sh);
 ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1)}
 ctx.drawImage(vid,sx,sy,sw,sh,0,0,w,h);ctx.restore();
 if(f&&Object.keys(f).length){const im=ctx.getImageData(0,0,w,h);fx(im.data,f);ctx.putImageData(im,0,0)}
 return true}
function analyze(){
 if(!draw(sctx,48,64,{z:1,cx:.5,cy:.5},null))return;
 const w=48,h=64,d=sctx.getImageData(0,0,w,h).data,L=new Float32Array(w*h);
 for(let i=0;i<w*h;i++)L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
 let s=0,mx=0,my=0;const wt=new Float32Array(w*h);
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,p=i*4;
  const g=Math.abs(L[i+1]-L[i-1])+Math.abs(L[i+w]-L[i-w]),sat=Math.max(d[p],d[p+1],d[p+2])-Math.min(d[p],d[p+1],d[p+2]);
  const rr=d[p],gg=d[p+1],bb=d[p+2],skin=rr>95&&gg>40&&bb>20&&rr>gg&&rr>bb&&rr-gg>15&&sat>15;
  const dx=x/w-.5,dy=y/h-.5;let q=(g+sat*.5)*(skin?1.8:1)*Math.exp(-(dx*dx+dy*dy)*3);q*=q;
  wt[i]=q;s+=q;mx+=q*x/w;my+=q*y/h}
 if(s<1)return;mx/=s;my/=s;let vx=0,vy=0;
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const q=wt[y*w+x];vx+=q*(x/w-mx)**2;vy+=q*(y/h-my)**2}
 const sd=(Math.sqrt(vx/s)+Math.sqrt(vy/s))/2,z=clamp(Math.round(.26/sd*10)/10,1,3);
 T.x+=(clamp(mx,.2,.8)-T.x)*.25;T.y+=(clamp(my,.2,.8)-T.y)*.25;T.z+=(z-T.z)*.25}
function overlay(){
 const z=V.z,x0=clamp(V.cx-.5/z,0,1-1/z),y0=clamp(V.cy-.5/z,0,1-1/z);
 const px=clamp((T.x-x0)*z,.04,.96),py=clamp((T.y-y0)*z,.04,.96);
 $('dot').style.left=px*100+'%';$('dot').style.top=py*100+'%';
 const ln=$('ln');ln.setAttribute('x2',px*100);ln.setAttribute('y2',py*100);
 const ok=Math.hypot(px-.5,py-.5)<.08;$('ring').classList.toggle('ok',ok);
 let t;if(auto)t=ok?'Enquadramento IA pronto ✓':'IA ajustando…';
 else if(ok)t='Ponto alinhado · sugestão '+T.z.toFixed(1)+'×';
 else{const a=[];if(px<.42)a.push('esquerda');else if(px>.58)a.push('direita');if(py<.42)a.push('cima');else if(py>.58)a.push('baixo');t='Siga a seta: gire para '+a.join(' e ')}
 $('hint').textContent=t}
let n=0;
function loop(){requestAnimationFrame(loop);if(!vid.videoWidth)return;
 const tv=auto?{z:T.z,cx:T.x,cy:T.y}:{z:manualZ,cx:.5,cy:.5};
 for(const k of['z','cx','cy'])V[k]+=(tv[k]-V[k])*.12;
 if(n++%8===0)analyze();
 draw(vctx,W,H,V,FILTERS[cur]);overlay()}
async function start(){
 try{stream&&stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1280}},audio:false});
  mirror=facing==='user';vid.srcObject=stream;await vid.play();$('start').style.display='none'}
 catch(e){$('hint').textContent='Câmera indisponível. Abra o link direto no navegador e permita o acesso.';$('start').style.display='block'}}
function shoot(){
 const vw=vid.videoWidth;if(!vw)return;const vh=vid.videoHeight,bw=vw/vh>.75?vh*.75:vw;
 const w=Math.min(1080,Math.round(bw)),h=Math.round(w*4/3),c=document.createElement('canvas');c.width=w;c.height=h;
 draw(c.getContext('2d',{willReadFrequently:true}),w,h,V,FILTERS[cur]);
 const fl=$('flash');fl.style.opacity=.8;setTimeout(()=>fl.style.opacity=0,120);
 c.toBlob(async b=>{const f=new File([b],'foto.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){}}
  $('pic').src=URL.createObjectURL(b);$('modal').style.display='flex'},'image/jpeg',.92)}
function chips(el,items,get,set){el.innerHTML='';items.forEach(i=>{const b=document.createElement('button');b.className='chip'+(get(i)?' on':'');b.textContent=i.label||i;
 b.onclick=()=>{set(i);chips(el,items,get,set)};el.appendChild(b)})}
chips($('filters'),Object.keys(FILTERS),k=>k===cur,k=>cur=k);
chips($('zooms'),[1,1.5,2,3].map(z=>({z,label:z+'×'})),i=>!auto&&i.z===manualZ,i=>{manualZ=i.z;auto=false;$('auto').classList.remove('on')});
$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto);chips($('zooms'),[1,1.5,2,3].map(z=>({z,label:z+'×'})),i=>!auto&&i.z===manualZ,i=>{manualZ=i.z;auto=false;$('auto').classList.remove('on')})};
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
$('gridbtn').onclick=()=>{const g=$('grid'),on=g.style.display!=='block';g.style.display=on?'block':'none';$('gridbtn').classList.toggle('on',on)};
$('shot').onclick=shoot;$('start').onclick=start;$('close').onclick=()=>$('modal').style.display='none';
loop();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
