<title>Enquadra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000;--fg:#fff;--amber:#f5a623;--chip:#222;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;max-width:calc((100dvh - 250px)*.75);aspect-ratio:3/4;background:#111;border-radius:18px;overflow:hidden}
#view{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ln{stroke:var(--amber);stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke}
#ring,#dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#ring{left:50%;top:50%;width:56px;height:56px;border:2px solid #fff8;transition:.2s}
#ring.ok{border-color:#4ade80;box-shadow:0 0 18px #4ade80aa}
#dot{width:16px;height:16px;background:var(--amber);box-shadow:0 0 14px var(--amber)}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#000a;padding:7px 14px;border-radius:16px;font-size:13px;text-align:center;line-height:1.3;max-width:92%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(#fff5,#fff5) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff5,#fff5) 66.66% 0/1px 100% no-repeat,linear-gradient(#fff5,#fff5) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff5,#fff5) 0 66.66%/100% 1px no-repeat}
.top{position:absolute;top:8px;background:#000a;padding:6px 11px;font-size:12px}#gridbtn{right:10px}#applebtn{left:10px}#enhbtn{left:50%;transform:translateX(-50%)}
#frame{touch-action:none}
.mc{background:#000a;padding:6px 11px;font-size:12px}
#modes{position:absolute;top:44px;left:8px;right:8px;display:none;justify-content:center;gap:6px;flex-wrap:wrap}
#zrow{display:flex;align-items:center;gap:8px;width:100%;max-width:440px;padding:0 12px;box-sizing:border-box}
#zs{flex:1;min-width:0;accent-color:var(--amber)}#zv{min-width:42px;text-align:right;font-size:13px}.zb{padding:5px 11px}#za{display:none}
#ctrl{padding:8px 0 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
#filters,#zooms{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:0 12px}
.chip{background:var(--chip);color:var(--fg);border:0;border-radius:99px;padding:7px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--amber);color:#000;font-weight:600}
#row{display:flex;align-items:center;gap:36px}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid #000;outline:3px solid #fff}
#shot:active{transform:scale(.93)}
.side{width:48px;height:48px;border-radius:50%;background:var(--chip);color:var(--fg);border:0;font-size:15px;font-weight:700}
.side.on{background:var(--amber);color:#000}
#start{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:var(--amber);color:#000;border:0;border-radius:99px;padding:16px 28px;font-size:17px;font-weight:700}
#modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#pic{max-width:100%;max-height:70%;border-radius:12px}

const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const sm=document.createElement('canvas');sm.width=80;sm.height=107;const sctx=sm.getContext('2d',{willReadFrequently:true});
const FILTERS={
 'Natural':{},
 'Vintage':{con:1.1,sat:.75,bri:1.05,tint:[18,8,-14],fade:18,grain:10},
 'Negativo':{con:1.25,sat:1.2,bri:1,tint:[-6,6,10],fade:10,grain:14},
 'P&B':{con:1.3,sat:0,bri:1.02,fade:8,grain:16},
 'Cinema':{con:1.15,sat:1.1,bri:.98,split:1},
 'Kodak':{con:1.1,sat:1.25,bri:1.03,tint:[14,6,-10],fade:6,grain:8},
 'Fuji':{con:1.1,sat:1.1,bri:1,tint:[-8,6,4],fade:8,grain:8},
 'Polaroid':{con:.95,sat:.85,bri:1.08,tint:[10,4,10],fade:26,grain:6},
 'Sépia':{con:1.1,sat:0,bri:1.05,tint:[40,20,-20],fade:10,grain:12},
 'Noir':{con:1.6,sat:0,bri:.95,grain:20}

let cur='Natural',zoomSet=null,mode='auto',blurOn=true,bokeh=0,hasMask=false,kind='cena',pick=0,auto=false,facing='environment',mirror=false,stream=null;

 for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];const l=.299*r+.587*g+.114*b;

  if(gr){const n=(Math.random()-.5)*gr;r+=n;g+=n;b+=n}
  d[i]=r;d[i+1]=g;d[i+2]=b}}
function draw(ctx,w,h,v,f,bk){
 const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return false;
 let bw,bh;if(vw/vh>.75){bh=vh;bw=vh*.75}else{bw=vw;bh=vw/.75}
 const bx=(vw-bw)/2,by=(vh-bh)/2,sw=bw/v.z,sh=bh/v.z,cxs=mirror?1-v.cx:v.cx;
 const sx=bx+clamp(cxs*bw-sw/2,0,bw-sw),sy=by+clamp(v.cy*bh-sh/2,0,bh-sh);

 if(bk&&bokeh>.03&&hasMask)applyBokeh(ctx,w,h,v);
 if(f)post(ctx,w,h,f);
 return true}
function post(ctx,w,h,f,en=enhance){
 const hasF=Object.keys(f).length;if(!en&&!hasF)return;
 const im=ctx.getImageData(0,0,w,h),d=im.data;
 if(en){const t=lut();for(let i=0;i<d.length;i+=4){d[i]=t[d[i]];d[i+1]=t[d[i+1]];d[i+2]=t[d[i+2]]}}
 if(hasF)fx(d,f);ctx.putImageData(im,0,0)}
function lut(){const t=new Uint8ClampedArray(256),r=Math.max(E.hi-E.lo,60);for(let i=0;i<256;i++){t[i]=Math.pow(clamp((i-E.lo)/r,0,1),E.e)*255}return t}
function sharpen(ctx,w,h){const im=ctx.getImageData(0,0,w,h),s=im.data,o=new Uint8ClampedArray(s),k=.5,r=w*4;
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const j=i+c;o[j]=s[j]+k*(4*s[j]-s[j-4]-s[j+4]-s[j-r]-s[j+r])}}
 im.data.set(o);ctx.putImageData(im,0,0)}
const TW=80,TH=107,TC={};
let K=null,A={x:.5,y:.5},off={x:0,y:0},dsp={x:0,y:0},st='search',sf=0,still=0,anim=0,zoomed=false,zoomZ=1,fr=0,lastT=-1,sh={x:.5,y:.5},maskBase={x:0,y:0},panC={x:.5,y:.5},gest=0,sdrag=false,cands=[];
const mc=document.createElement('canvas');mc.width=TW;mc.height=TH;const mctx=mc.getContext('2d');
function resetAI(){K=null;st='search';sf=0;still=0;anim=0;zoomed=false;hasMask=false;kind='cena';off.x=off.y=dsp.x=dsp.y=0;sh.x=sh.y=.5}
function cnv(k,w,h){const key=k+w;let c=TC[key];if(!c||c.height!==h){c=TC[key]=document.createElement('canvas');c.width=w;c.height=h}return c}
/* desfoque de fundo: nítido só no objeto (máscara acompanha o movimento) */
function applyBokeh(ctx,w,h,v){
 const a=cnv('a',w>>2,h>>2),b=cnv('b',Math.max(8,Math.round(w/9)),Math.max(8,Math.round(h/9))),bl=cnv('bl',w,h),sp=cnv('sp',w,h);
 const ca=a.getContext('2d'),cb=b.getContext('2d'),cl=bl.getContext('2d'),cs=sp.getContext('2d');
 ca.drawImage(ctx.canvas,0,0,w,h,0,0,a.width,a.height);
 cb.drawImage(a,0,0,a.width,a.height,0,0,b.width,b.height);
 cl.imageSmoothingEnabled=true;cl.imageSmoothingQuality='high';cl.drawImage(b,0,0,b.width,b.height,0,0,w,h);
 cs.globalCompositeOperation='source-over';cs.clearRect(0,0,w,h);cs.drawImage(ctx.canvas,0,0);
 const z=v.z,x0=clamp(v.cx-.5/z,0,1-1/z),y0=clamp(v.cy-.5/z,0,1-1/z),sx=(off.x+dsp.x-maskBase.x)/TW,sy=(off.y+dsp.y-maskBase.y)/TH;
 cs.globalCompositeOperation='destination-in';cs.imageSmoothingEnabled=true;

function track(K,C,px,py){
 const w=TW,h=TH,R=5,cx=Math.round(px),cy=Math.round(py),Q=2*R+1,S=new Float32Array(Q*Q).fill(-1);
 let best=1e18,bx=0,by=0,tot=0,nn=0;
 for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const dx=cx+i,dy=cy+j;
  const x0=Math.max(4,4-dx),x1=Math.min(w-4,w-4-dx),y0=Math.max(4,4-dy),y1=Math.min(h-4,h-4-dy);
  if(x1-x0<w*.4||y1-y0<h*.4)continue;
  let s=0,c=0;for(let y=y0;y<y1;y+=2){const rk=y*w,rc=(y+dy)*w+dx;for(let x=x0;x<x1;x+=2){s+=Math.abs(C[rc+x]-K[rk+x]);c++}}
  s/=c;S[(j+R)*Q+i+R]=s;tot+=s;nn++;if(s<best){best=s;bx=i;by=j}}
 if(!nn||best>.85*tot/nn)return null;
 const g=(a,b)=>S[(by+R+b)*Q+bx+R+a];let fx=0,fy=0;
 if(bx>-R&&bx<R){const l=g(-1,0),m=g(0,0),r=g(1,0),dn=l-2*m+r;if(l>=0&&r>=0&&dn>0)fx=clamp((l-r)/(2*dn),-.5,.5)}
 if(by>-R&&by<R){const u=g(0,-1),m=g(0,0),q=g(0,1),dn=u-2*m+q;if(u>=0&&q>=0&&dn>0)fy=clamp((u-q)/(2*dn),-.5,.5)}

/* ---- escaneamento da cena: céu, objetos e pessoas ---- */
function integ(A,w,h){const I=new Float64Array((w+1)*(h+1));for(let y=0;y<h;y++){let s=0;for(let x=0;x<w;x++){s+=A[y*w+x];I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+s}}return I}
function bmean(I,w,h,x,y,r){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1),y0=Math.max(0,y-r),y1=Math.min(h,y+r+1),W1=w+1;
 return(I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0])/((x1-x0)*(y1-y0))}
function hmean(I,w,h,x,y,r){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1),W1=w+1;return(I[(y+1)*W1+x1]-I[y*W1+x1]-I[(y+1)*W1+x0]+I[y*W1+x0])/(x1-x0)}
function ero(m,w,h,r){const v=new Uint8Array(m.length);for(let i=0;i<m.length;i++)v[i]=m[i]?0:1;const o=dil(v,w,h,r);for(let i=0;i<o.length;i++)o[i]=o[i]?0:1;return o}
function dil(m,w,h,r){const t=new Uint8Array(m.length),o=new Uint8Array(m.length);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let k=-r;k<=r;k++){const xx=x+k;if(xx>=0&&xx<w&&m[y*w+xx]){v=1;break}}t[y*w+x]=v}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0;for(let k=-r;k<=r;k++){const yy=y+k;if(yy>=0&&yy<h&&t[yy*w+x]){v=1;break}}o[y*w+x]=v}

function comps(m,w,h,S){
 const lab=new Int16Array(w*h).fill(-1),out=[],q=new Int32Array(w*h);
 for(let s=0;s<w*h;s++){if(!m[s]||lab[s]>=0)continue;
  const id=out.length,c={id,a:0,sx:0,sy:0,x0:w,y0:h,x1:0,y1:0,b:0,ss:0};let qs=0,qe=0;q[qe++]=s;lab[s]=id;
  while(qs<qe){const p=q[qs++],x=p%w,y=(p/w)|0;c.a++;c.sx+=x;c.sy+=y;c.ss+=S?S[p]:0;
   if(x<c.x0)c.x0=x;if(x>c.x1)c.x1=x;if(y<c.y0)c.y0=y;if(y>c.y1)c.y1=y;
   if(x>0&&m[p-1]&&lab[p-1]<0){lab[p-1]=id;q[qe++]=p-1}
   if(x<w-1&&m[p+1]&&lab[p+1]<0){lab[p+1]=id;q[qe++]=p+1}
   if(y>0&&m[p-w]&&lab[p-w]<0){lab[p-w]=id;q[qe++]=p-w}
   if(y<h-1&&m[p+w]&&lab[p+w]<0){lab[p+w]=id;q[qe++]=p+w}}

function feat(d,w,h){
